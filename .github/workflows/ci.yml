name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Настроить python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Установить зависимости
        run: python -m pip install -r app/requirements.txt
